# Cloudflare Tunnel (cloudflared) connector.
#
# This Deployment establishes an outbound-only tunnel to Cloudflare, which lets
# you reach the internal `frontend` Service (ClusterIP) over your Cloudflare
# domain with automatic HTTPS, WITHOUT any public IP / LoadBalancer on GCP.
#
# Auth uses a remotely-managed tunnel token. The token is read from a Secret
# named `cloudflared` (key: `tunnel-token`). The public-hostname -> service
# mapping (e.g. shop.example.com -> http://frontend:80) is configured in the
# Cloudflare Zero Trust dashboard for the named tunnel. See README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 2 # two connectors for HA; set to 1 to minimize cost
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.10.0
          args:
            - tunnel
            - --no-autoupdate
            # expose metrics + /ready endpoint for health probes
            - --metrics
            - 0.0.0.0:2000
            - run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared
                  key: tunnel-token
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
